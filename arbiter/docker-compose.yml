services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: arbiter
      POSTGRES_PASSWORD: arbiter
      POSTGRES_DB: arbiter
    ports:
      - "5432:5432"
    volumes:
      - arbiter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbiter -d arbiter"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arbiter
      MINIO_ROOT_PASSWORD: arbiter123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - arbiter_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ARBITER_DATABASE_URL: postgresql+psycopg://arbiter:arbiter@db:5432/arbiter
      ARBITER_REDIS_URL: redis://redis:6379/0
      ARBITER_MINIO_ENDPOINT: minio:9000
      ARBITER_MINIO_ACCESS_KEY: arbiter
      ARBITER_MINIO_SECRET_KEY: arbiter123
      ARBITER_OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn arbiter.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  arbiter_pgdata:
  arbiter_minio:
