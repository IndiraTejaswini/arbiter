<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="ARBITER — auditable dispute adjudication. Rules decide; models never do."
    />
    <title>ARBITER · Dispute Adjudication</title>
    <script>
      // Apply the stored theme before first paint so a reload never flashes
      // the wrong background.
      (function () {
        try {
          var stored = localStorage.getItem("arbiter.theme");
          var dark = stored ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
